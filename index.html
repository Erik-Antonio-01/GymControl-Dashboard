<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymControl</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="assets/js/login.js" defer></script>
    <link rel="icon" type="image/png" href="assets/icons/gym.png">
</head>

<body>

    <!-- tela de carregamento -->
    <div id="loader" style="display: none;">
        <div class="text-center">
            <i class="bi bi-barbell fs-1"></i>
            <h2 class="mt-3">GymControl</h2>
            <div class="spinner-border text-primary mt-3"></div>
            <p class="mt-3">Entrando...</p>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <!-- Pagina Login -->
                <div class="card text-white bg-dark mb-3">
                    <div class="card-header">
                        <!-- logo -->
                        <i class="bi bi-barbell fs-1"></i>

                        <h1 class="text-center mt-5 fw-bold">GymControl</h1>
                        <p class="text-center text-light mb-5">Sistema de Gestão para Academias</p>

                    </div>
                    <div class="card-body">
                        <h4 class="card-title text-center mb-4">Login</h4>
                        <!-- formulario -->
                        <form id="formLogin" action="#" method="post" class="needs-validation card-text" novalidate>
                            <!-- email -->
                            <div class="my-5">
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-envelope-fill"></i>
                                    </span>
                                    <div class="form-floating">
                                        <input type="email" class="form-control" id="email" placeholder="Email" required>
                                        <label for="email">E-mail</label>
                                    </div>
                                </div>
                                <div class="invalid-feedback">
                                    Informe um e-mail válido.
                                </div>
                            </div>

                            <!-- senha -->
                            <div class="my-5">
                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>

                                    <div class="form-floating">
                                        <input type="password" class="form-control" id="senha" placeholder="Senha" required>
                                        <label for="senha">Senha</label>
                                    </div>
                                    <button class="btn btn-outline-light" type="button" id="mostrarSenha">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback">
                                    Digite sua senha.
                                </div>
                            </div>

                            <!-- lembrar-me -->
                            <div class="d-flex justify-content-between align-items-center mx-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="lembrar">

                                    <label class="form-check-label text-success" for="lembrar">Lembrar-me</label>
                                </div>
                                
                                <!-- esqueci minha senha -->
                                <a href="#">Esqueci minha senha
                                </a>
                            </div>

                            <!-- validação -->
                            <div class="mt-5 text-center d-grid">
                                <input type="submit" value="Entrar" class="btn btn-success btn-lg">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
